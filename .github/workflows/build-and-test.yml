name: Build and Test
on:
  - push

jobs:
  build-and-test:
    name: build and test project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Api
            directory: src/api
            solution: Teams.sln
            coverageDir: api
          - name: Authoriser
            directory: src/authoriser
            solution: Teams.Authoriser.sln
            coverageDir: authoriser
          - name: Gateway
            directory: src/gateway
            solution: Teams.DevGateway.sln
            coverageDir: gateway
    steps:
      - name: 📩 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ☁️ install tools
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: 🔨 build solution
        working-directory: ${{ matrix.directory }}
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: 🧪 run tests
        working-directory: ${{ matrix.directory }}
        run: |
          dotnet test ./${{ matrix.solution }} --configuration Release --collect "XPlat Code Coverage"
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:./../../coverage/${{ matrix.coverageDir }} -reporttypes:MarkdownSummaryGithub -filefilters:"-*/Migrations/*"

      - name: 💾 publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}CoverageReport
          path: coverage/${{ matrix.coverageDir }}/SummaryGithub.md
