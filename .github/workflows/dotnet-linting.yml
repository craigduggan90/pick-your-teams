name: Enforce Dotnet Format
on:
  - push

jobs:
  build-and-test:
    name: dotnet linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: src/api
            excludeArgs: --exclude ./Teams.Data/Context/Migrations/
          - directory: src/authoriser
            excludeArgs: ""
          - directory: src/gateway
            excludeArgs: ""
    steps:
      - name: 📩 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 🔍 dotnet linting
        working-directory: ${{ matrix.directory }}
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet format --verify-no-changes ${{ matrix.excludeArgs }}
